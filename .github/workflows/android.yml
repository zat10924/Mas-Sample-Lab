name: Build Android APK

# تشغيل يدوي: Actions > Build Android APK > Run workflow
# النتيجة: ملف APK في Releases (رابط ثابت للتحميل) وكمان في Artifacts
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm install

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://bzhxdikcyxkdojwlswhq.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_NDJle8iKFHVTezQ_CTjeqg_Usd42lkZ
          VITE_WHATSAPP_AUTO: ${{ vars.VITE_WHATSAPP_AUTO }}
          # رابط برنامج المصنع (للزرار "برنامج المصنع") والرابط العام للمختبر (للمشاركة والـ QR)
          VITE_MAIN_APP_URL: ${{ vars.MAIN_APP_URL || 'https://zat10924.github.io/' }}
          VITE_PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://zat10924.github.io/mas-sample-lab/' }}

      - name: Add Android project
        run: npx cap add android

      - name: Generate icons and splash
        continue-on-error: true
        run: >
          npx capacitor-assets generate --android
          --iconBackgroundColor '#642631' --iconBackgroundColorDark '#642631'
          --splashBackgroundColor '#5E232E' --splashBackgroundColorDark '#5E232E'

      - name: Configure Android (camera permission, version, signing key)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' "$MANIFEST" || \
            sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.CAMERA" />#' "$MANIFEST"
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$VERSION\"/" android/app/build.gradle

      - name: Configure stable debug signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Set the ANDROID_DEBUG_KEYSTORE_BASE64 repository secret."
            exit 1
          fi
          mkdir -p ~/.android
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
          grep -n "versionCode\|versionName" android/app/build.gradle

      - run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk mas-lab.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mas-lab-apk
          path: mas-lab.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: مختبر الماس (build ${{ github.run_number }})
          make_latest: true
          files: mas-lab.apk
