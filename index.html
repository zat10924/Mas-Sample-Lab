<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#642631" />
    <meta name="description" content="مختبر الماس - عينات البورسلين والجليز والزخرفة" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- الوضع الليلي/النهاري: نفس مفتاح "theme" في برنامج المصنع (مشترك لأنهم على نفس الدومين) -->
    <script>
      try {
        var t = localStorage.getItem('theme')
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
    <title>مختبر الماس</title>
  </head>
  <body>
    <div id="root">
      <!-- شاشة فتح احترافية بتظهر قبل ما الجافاسكربت يحمّل، وReact بيستبدلها بنفس الشكل -->
      <div class="splash" role="status" aria-busy="true" aria-label="مختبر الماس">
        <div class="splash-mark">
          <span class="splash-ring"></span>
          <img src="/icons/icon-192.png" alt="" class="splash-logo" />
        </div>
        <div class="splash-title">مختبر <span>الماس</span></div>
        <div class="splash-sub">للخزف والصيني</div>
        <div class="splash-bar"><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
